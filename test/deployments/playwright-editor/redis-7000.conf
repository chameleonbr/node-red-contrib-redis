port 7000
bind 127.0.0.1
protected-mode no
save ""
appendonly no
dir /data

cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
cluster-announce-ip 127.0.0.1
cluster-announce-port 7000
cluster-announce-bus-port 17000

user default off
user node_red on >node-red-pass ~* &* +@all
